[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vesuvius-autoresearch"
version = "0.1.0"
description = "CPU-safe Vesuvius Scroll Prize ink-detection research, validation, and dashboard tooling."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Vesuvius AutoResearch contributors" }
]
keywords = ["vesuvius", "scroll-prize", "ink-detection", "computer-vision", "autoresearch"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
  "torch>=2.2",
]

[project.optional-dependencies]
ingestion = [
  "vesuvius",
  "tifffile",
  "pillow",
  "zarr",
  "s3fs",
  "lxml",
  "nest_asyncio",
]
dev = [
  "build",
]

[project.urls]
Homepage = "https://github.com/scrollprize"
Data = "https://scrollprize.org/data"
Prizes = "https://scrollprize.org/prizes"

[project.scripts]
vesuvius-autoresearch = "autoresearch:main"
vesuvius-run-experiment = "run_experiment:main"
vesuvius-dashboard = "research_dashboard.app:main"
vesuvius-dashboard-snapshot = "research_dashboard.snapshot:main"
vesuvius-audit-state = "scripts.audit_research_state:main"
vesuvius-infer-full-tile = "scripts.infer_full_tile:main"
vesuvius-evaluate-loo = "scripts.evaluate_leave_one_out:main"

[tool.setuptools]
py-modules = ["autoresearch", "run_dashboard", "run_experiment"]

[tool.setuptools.packages.find]
include = ["data*", "experiments*", "research_dashboard*", "scripts*"]
