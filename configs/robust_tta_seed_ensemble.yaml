model:
  name: tiny_torch_unet
  base_channels: 8
training:
  epochs: 5
  batch_size: 8
  learning_rate: 0.0012
  weight_decay: 0.0001
  pos_weight: auto
  max_train_samples: 0
  allow_cuda: false
  seeds:
  - 11001
  - 11013
  - 11029
  deterministic: true
evaluation:
  main_metric: val_f1
  threshold: 0.5
  tta_flips: true
outputs:
  runs_dir: experiments/runs
dataset:
  research_scope: multi_segment_robust_expanded_tta_ensemble
  train_npz: data/real_cross_folds_expanded_combined/all_segments/train.npz
  val_npz: data/real_cross_folds_v2/segment_20230520175435/val.npz
  patch_size: 64
  validation_mode: leave-one-segment-out
autoresearch:
  scope_policy: expanded_multi_segment_leave_one_out
