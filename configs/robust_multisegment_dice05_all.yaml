# Robust multi-segment PyTorch baseline selected by leave-one-segment-out median F1.
dataset:
  research_scope: multi_segment_robust
  train_npz: data/real_cross_folds_combined/all_segments/train.npz
  val_npz: data/real_cross_folds/segment_20230520175435/val.npz
  patch_size: 64
  validation_mode: multi-segment-train_reference-val
model:
  name: tiny_torch_unet
  base_channels: 8
training:
  epochs: 5
  batch_size: 8
  learning_rate: 0.002
  weight_decay: 0.0001
  pos_weight: auto
  max_train_samples: 0
  num_threads: 4
  seed: 11001
  allow_cuda: false
  dice_loss_weight: 0.5
  augment_flips: false
evaluation:
  main_metric: val_f1
  threshold: 0.50
autoresearch:
  parent_reason: robust multi-segment config from leave-one-out fold rotation; validate by rotating val_npz before promotion
  scope_policy: multi_segment_leave_one_out
outputs:
  runs_dir: experiments/runs
