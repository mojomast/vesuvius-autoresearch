# Real cross-segment experiment with lower-positive train sampling and tempered auto class weight.
dataset:
  research_scope: focused_pair
  train_npz: data/real_cross/segment_20230827161847_pf0p15_n2048/train.npz
  val_npz: data/real_cross/segment_20230520175435/val.npz
  patch_size: 64
  validation_mode: cross-segment
model:
  name: tiny_numpy_ink_logreg
  depth: 3
training:
  epochs: 5
  learning_rate: 0.144
  weight_decay: 0.0001
  pos_weight: auto
evaluation:
  main_metric: val_f1
  threshold: 0.50
autoresearch:
  parent_reason: lower train positive oversampling plus tempered auto class weight to test AP/F1 tradeoff
  scope_policy: focused_pair_only
outputs:
  runs_dir: experiments/runs
