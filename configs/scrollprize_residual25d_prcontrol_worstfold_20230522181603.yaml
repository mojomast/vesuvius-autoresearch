# Bounded Scroll Prize best-practice probe for the current weakest LOO fold.
# Uses real 3-channel 2.5D NPZs, 64x64 windows, fold-safe leave-one-segment-out
# validation, hard-negative-biased sampling, and explicit positive-rate control.
autoresearch:
  parent_reason: 'May 2026 Scroll Prize best-practice probe: residual 2.5D + hard negatives + positive-rate control on weakest LOO fold'
  scope_policy: expanded_multi_segment_leave_one_out
  heldout_segment: '20230522181603'
  intent: bounded_training_probe
  promotable: false
dataset:
  patch_size: 64
  research_scope: multi_segment_residual25d_prcontrol_worstfold
  train_npz: data/real_cross_folds_expanded_combined/leaveout_20230522181603/train.npz
  val_npz: data/real_cross_folds_v2/segment_20230522181603/val.npz
  validation_mode: leave-one-segment-out
validation_setup:
  mode: leave-one-segment-out
  train_segments:
    - '20230520175435'
    - '20230522215721'
    - '20230530212931'
    - '20230531121653'
    - '20230827161847'
    - '20230901184804'
  val_segment_id: '20230522181603'
model:
  name: residual_25d_torch_unet
  base_channels: 8
  input_mode: z_offsets_as_channels
outputs:
  runs_dir: experiments/runs
training:
  allow_cuda: false
  deterministic: true
  num_threads: 4
  seed: 250528
  epochs: 4
  batch_size: 8
  learning_rate: 0.001
  weight_decay: 0.0001
  pos_weight: auto
  dice_loss_weight: 0.35
  positive_rate_loss_weight: 0.06
  positive_rate_loss_target: 0.04
  positive_rate_loss_tolerance: 0.01
  max_train_samples: 3072
  patch_sampling: hard_mining
  positive_patch_fraction: 0.45
  hard_negative_fraction: 0.75
  negative_patch_max_ink: 0.0
  augment_flips: true
evaluation:
  main_metric: val_f1
  threshold: 0.31
  tta_flips: true
  max_pred_positive_rate_ratio: 3.0
  min_pred_positive_rate_ratio: 0.1
  target_pred_positive_rate: auto_val
