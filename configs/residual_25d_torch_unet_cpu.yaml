dataset:
  research_scope: focused_pair_residual_25d_cpu
  train_npz: data/real_cross/segment_20230827161847_pf0p15_n2048/train.npz
  val_npz: data/real_cross/segment_20230520175435/val.npz
  patch_size: 64
  validation_mode: cross-segment
model:
  name: residual_25d_torch_unet
  base_channels: 8
training:
  epochs: 5
  batch_size: 4
  learning_rate: 0.0012
  weight_decay: 0.0001
  pos_weight: auto
  max_train_samples: 512
  deterministic: true
  augment_flips: true
  allow_cuda: false
evaluation:
  main_metric: val_f1
  threshold: 0.5
  tta_flips: true
autoresearch:
  scope_policy: focused_pair_only
outputs:
  runs_dir: experiments/runs
