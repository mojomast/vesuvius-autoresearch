# Residual 2.5D search: max_pred_positive_rate_ratio = 2.5
# Base: configs/residual_25d_cpu_safe.yaml
# Rationale: Tighten the cap into the historical 2.5-3.0 band.
dataset:
  patch_size: 64
  research_scope: multi_segment_residual25d_prcontrol_worstfold
  train_npz: data/real_cross_folds_expanded_combined/leaveout_20230520175435/train.npz
  val_npz: data/real_cross_folds_v2/segment_20230520175435/val.npz
  validation_mode: leave-one-segment-out
model:
  name: residual_25d_torch_unet
  input_mode: z_offsets_as_channels
  base_channels: 8
training:
  epochs: 4
  batch_size: 8
  learning_rate: 0.001
  weight_decay: 0.0001
  pos_weight: auto
  max_train_samples: 1024
  deterministic: true
  augment_flips: true
  allow_cuda: false
  dice_loss_weight: 0.35
  hard_negative_fraction: 0.75
  negative_patch_max_ink: 0.0
  num_threads: 4
  patch_sampling: hard_mining
  positive_patch_fraction: 0.45
  positive_rate_loss_target: 0.04
  positive_rate_loss_tolerance: 0.01
  positive_rate_loss_weight: 0.08
  seed: 11018
evaluation:
  main_metric: val_f1
  threshold: 0.31
  tta_flips: true
  max_pred_positive_rate_ratio: 2.5
  min_pred_positive_rate_ratio: 0.1
  target_pred_positive_rate: auto_val
autoresearch:
  scope_policy: expanded_multi_segment_leave_one_out
  fold_map: data/real_cross_folds_expanded_combined/fold_map.json
  heldout_segment: "20230520175435"
  intent: bounded_training_probe
  parent_config: configs/residual_25d_cpu_safe.yaml
  parent_reason: positive-rate cap sweep from residual 2.5D CPU-safe base
  promotable: false
outputs:
  runs_dir: experiments/runs
